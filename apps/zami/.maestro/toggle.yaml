# Zam's ToggleSwitch, translated to React Native, switches on and off and reports its
# state to accessibility.
appId: com.leonsilicon.zami
---
- runFlow: subflows/launch-app.yaml
- assertVisible: "Toggle is off"
- assertVisible:
    text: "Demo toggle"
    checked: false
- tapOn:
    text: "Demo toggle"
    retryTapIfNoChange: false
- assertVisible: "Toggle is on"
- assertVisible:
    text: "Demo toggle"
    checked: true
- tapOn:
    text: "Demo toggle"
    retryTapIfNoChange: false
- assertVisible: "Toggle is off"
