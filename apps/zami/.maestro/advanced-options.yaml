# LoginView opens Advanced options and toggles its sliding-sync checkbox both ways.
appId: com.leonsilicon.zami
---
- runFlow: subflows/launch-app.yaml
- scrollUntilVisible:
    element:
      text: ".*Advanced options.*"
    direction: DOWN
    centerElement: true
- tapOn:
    text: ".*Advanced options.*"
    retryTapIfNoChange: false
# The WebView may put the expanded checkbox below the fold.
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            text: "Use sliding sync.*"
          direction: DOWN

# Run the iOS state assertions when accessibility exposes the checkbox value.
- runFlow:
    when:
      platform: iOS
      visible: "checkbox, checked"
    commands:
      - tapOn: { text: "Use sliding sync.*", retryTapIfNoChange: false }
      - assertVisible: "checkbox, unchecked"
      - tapOn: { text: "Use sliding sync.*", retryTapIfNoChange: false }
      - assertVisible: "checkbox, checked"
- runFlow:
    when:
      platform: iOS
      visible: "checkbox, unchecked"
    commands:
      - tapOn: { text: "Use sliding sync.*", retryTapIfNoChange: false }
      - assertVisible: "checkbox, checked"
      - tapOn: { text: "Use sliding sync.*", retryTapIfNoChange: false }
      - assertVisible: "checkbox, unchecked"

# Android WebView reports the HTML input ID as its resource ID and provides a checked state.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: sliding-sync
          direction: DOWN
          centerElement: true
      - assertNotVisible: { id: sliding-sync, checked: true }
      - tapOn: { id: sliding-sync, retryTapIfNoChange: false }
      - assertVisible: { id: sliding-sync, checked: true }
      - tapOn: { id: sliding-sync, retryTapIfNoChange: false }
      - assertVisible: { id: sliding-sync }
      - assertNotVisible: { id: sliding-sync, checked: true }
