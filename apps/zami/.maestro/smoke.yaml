# A fresh install loads the bundled WebView and renders Zam’s sign-in screen.
appId: com.leonsilicon.zami
---
- runFlow: subflows/launch-app.yaml
- assertVisible: "Sign in to your Matrix account"
- assertVisible: "Sign in with QR code"
- scrollUntilVisible:
    element:
      text: "Don't have an account\\?.*"
    direction: DOWN
