# The app starts from a fresh install and renders its first screen: Metro's bundle loads
# on Hermes, Zam's i18n resolves its English strings (which needs the FormatJS polyfills),
# and Zam's Splash component renders through Uniwind.
appId: com.leonsilicon.zami
---
- runFlow: subflows/launch-app.yaml
- assertVisible: "i18n: Restoring session…"
# Splash's own copy of the same string (Maestro matches the whole text).
- assertVisible: "Restoring session…"
