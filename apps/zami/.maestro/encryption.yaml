# Matrix end-to-end encryption loads on the device: matrix-sdk-crypto-wasm's unmodified
# glue runs on its wasm2c build (react-native-matrix-sdk-crypto-wasm) and reports the
# versions of vodozemac and matrix-sdk-crypto.
appId: com.leonsilicon.zami
---
- runFlow: subflows/launch-app.yaml
- extendedWaitUntil:
    visible:
      id: crypto-status
      text: "Encryption: vodozemac \\S+, matrix-sdk-crypto \\S+"
    timeout: 30000
