# Launch the app (stopping it first if it's running) with its JS from the run's Metro, and
# wait for its first screen.
#
# `vpx _maestro` passes METRO_HOST (localhost:<its Metro port>); with bare `maestro test`
# it falls back to localhost:8081, the port `vpx _dev` serves on. iOS reads it from the
# RCT_jsLocation launch argument. Android ignores launch arguments for this: the runner
# points the app at Metro before every flow.
appId: com.leonsilicon.zami
---
- evalScript: '${output.metroHost = typeof METRO_HOST === "undefined" ? "localhost:8081" : METRO_HOST}'
- launchApp:
    arguments:
      RCT_jsLocation: ${output.metroHost}
# The first launch after Metro starts bundles the whole app. Waiting on the first screen
# and the error screens together fails fast on an error instead of waiting out the
# timeout. A fresh install has no session, so the first screen is Zam's sign-in screen
# (LoginView); update this when that changes.
- extendedWaitUntil:
    visible: "Welcome back!|.*(Uncaught Error|Render Error|Syntax Error|Unable to resolve module|Could not connect to development server|No script URL provided|Unable to load script|Reload \\(⌘R\\)|Reload \\(R, R\\)).*"
    timeout: 300000
- runFlow: assert-no-error-screen.yaml
