# Checks Zami's own code and its codemods against the pinned Zam submodule.
name: Zami CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "26"
          run-install: true
          cache: true
      - name: Format, lint and types (Zami's own code)
        run: vp check
      - run: vp run typecheck
      - run: vp run test
      - name: The codemods still apply
        run: vpx _patches check
      - name: Bundle the app (iOS and Android)
        run: vp run bundle
