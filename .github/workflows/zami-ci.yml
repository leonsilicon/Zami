# Zami's checks. `_zami check` enforces the porting invariants: no upstream file is ever
# modified, every copy-type upstream file has its Zami version, and no Zami file is stale
# or left with merge conflicts.
name: Zami CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git remote add upstream https://github.com/az4521/Zam.git && git fetch --no-tags upstream master
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          run-install: true
          cache: true
      - name: Format, lint and types (Zami's own code and the Zami files in Zam's tree)
        run: vp check
      - run: vp run typecheck
      - name: Tests (Zami's tooling, then upstream Zam's tests against the Zami files)
        run: vp run test
      - name: Bundle the app (iOS and Android)
        run: vp run bundle
      - name: Porting invariants
        run: vpx _zami check
