# Ships Zami to TestFlight: every push to main, and on demand. It runs `vpx _testflight`,
# which archives the Release build, signs it with the team's distribution certificate
# and the App Store profile it keeps current through the App Store Connect API, and
# uploads it. Builds reach the internal group "Leon" once App Store Connect has
# processed them.
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App Store Connect API key and its
# .p8 contents), and IOS_DIST_CERT_P12 (base64) with IOS_DIST_CERT_PASSWORD: one of team
# M76P5G9HXK's distribution certificates, the one EAS stores as 594A6U353R.
name: Zami TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time; a newer push replaces a waiting one, never a running one.
concurrency:
  group: zami-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          run-install: true
          cache: true
      - name: Put the distribution certificate in a keychain of its own
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning
      - name: Disk before the build
        run: df -h /
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: vpx _testflight
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
