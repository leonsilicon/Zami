# Builds one of Zami's variants and uploads it to TestFlight, with `vpx _testflight` on a
# GitHub-hosted Mac: "staging" is the app "(S) Zami", "production" the app "Zami" (see
# apps/zami/app.config.ts). zami-staging.yml and zami-production.yml call it; it also
# runs on its own from the Actions tab. Builds reach each app's internal group "Leon"
# once App Store Connect has processed them.
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App Store Connect API key and its
# .p8 contents), and IOS_DIST_CERT_P12 (base64) with IOS_DIST_CERT_PASSWORD: one of team
# M76P5G9HXK's distribution certificates, the one EAS stores as 594A6U353R.
name: Zami TestFlight

on:
  workflow_call:
    inputs:
      variant:
        description: The app to build, "staging" or "production".
        required: true
        type: string
      ref:
        description: The commit to build. Defaults to the one that triggered the run.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      variant:
        description: The app to build
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  ios:
    name: iOS ${{ inputs.variant }} → TestFlight
    runs-on: macos-26
    timeout-minutes: 180
    # One upload of each app at a time; a newer run replaces a waiting one, never a running one.
    concurrency:
      group: zami-testflight-${{ inputs.variant }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "26"
          run-install: true
          cache: true
      - name: Put the distribution certificate in a keychain of its own
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning
      - name: Disk before the build
        run: df -h /
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VARIANT: ${{ inputs.variant }}
        run: vpx _testflight --variant "$VARIANT"
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
