# Check upstream Zam after a fork webhook or manual dispatch and bump the verified pin.
# ZAMI_BOT_TOKEN lets the push trigger trunk's normal workflows.
name: Zami upstream sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zami-upstream-sync
  cancel-in-progress: false

env:
  ZAM: repos/com/github/az4521/Zam

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.upstream.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find and check out a new Zam commit
        id: upstream
        run: |
          set -euo pipefail
          current=$(git rev-parse "HEAD:$ZAM")
          url=$(git config --file .gitmodules --get submodule.Zam.url)
          branch=$(git config --file .gitmodules --get submodule.Zam.branch)
          latest=$(git ls-remote --exit-code "$url" "refs/heads/$branch" | cut -f1)
          if [[ "$latest" == "$current" ]]; then
            echo "Zam is already at ${current:0:10}."
            exit 0
          fi
          git update-index --cacheinfo "160000,$latest,$ZAM"
          git submodule update --init --depth 1 -- "$ZAM"
          echo "Checking Zam ${current:0:10} → ${latest:0:10}."
          echo "commit=$latest" >> "$GITHUB_OUTPUT"
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: steps.upstream.outputs.commit != ''
        with:
          node-version: "26"
          run-install: true
          cache: true
      - name: Check codemods and build Zam
        if: steps.upstream.outputs.commit != ''
        run: |
          vpx _patches check
          vpx _web build

  bump:
    needs: check
    if: needs.check.outputs.commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use a fresh checkout with write credentials after upstream's build scripts have run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.ZAMI_BOT_TOKEN }}
      - name: Commit and push the verified submodule pin
        env:
          ZAM_COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "zami-bot"
          git config user.email "zami-bot@users.noreply.github.com"
          git update-index --cacheinfo "160000,$ZAM_COMMIT,$ZAM"
          git commit -m "Bump Zam to ${ZAM_COMMIT:0:10}"
          git push origin "HEAD:$GITHUB_REF"
