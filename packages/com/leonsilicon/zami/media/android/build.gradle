plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.leonsilicon.zami.media'
version = '0.0.0'

android {
  namespace "com.leonsilicon.zami.media"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
